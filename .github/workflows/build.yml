name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly build --release --bin wa-bot
      - uses: actions/upload-artifact@v4
        with:
          name: wa-bot-linux-x86_64
          path: target/release/wa-bot
          retention-days: 30
