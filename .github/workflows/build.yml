name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config libssl-dev mold
      - name: Install Rust nightly
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --profile minimal
          . "$HOME/.cargo/env"
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build
        run: |
          . "$HOME/.cargo/env"
          cargo +nightly build --release --bin wa-bot
      - uses: actions/upload-artifact@v4
        with:
          name: wa-bot-linux-x86_64
          path: target/release/wa-bot
          retention-days: 30